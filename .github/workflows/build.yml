name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 说明：这里刻意不再使用 android-actions/setup-android@v3。
      # 该 action 目前被强制运行在 Node.js 24 上，近期频繁在 setup 阶段直接失败，
      # 会导致后续 sdkmanager / 编译 / 上传全部被跳过。
      # 改为直接使用 GitHub runner 预装的 Android SDK，仅当缺包时才联网安装。
      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/cmdline-tools/bin:$SDK/tools/bin:$SDK/platform-tools:$PATH"

          # 兜底：runner 上完全没有 command-line tools 时自行下载
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "未找到 sdkmanager，下载 Android command-line tools…"
            curl -fsSL -o /tmp/cmdtools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p /tmp/cmdtools
            unzip -q -o /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
            export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          fi
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          pick_bt() {
            for v in 34.0.0 35.0.0 36.0.0; do
              if [ -x "$SDK/build-tools/$v/aapt2" ]; then echo "$SDK/build-tools/$v"; return 0; fi
            done
            for d in "$SDK"/build-tools/*; do
              if [ -x "$d/aapt2" ]; then echo "$d"; return 0; fi
            done
            return 1
          }
          pick_jar() {
            for v in 34 35 36 33; do
              if [ -f "$SDK/platforms/android-$v/android.jar" ]; then echo "$SDK/platforms/android-$v/android.jar"; return 0; fi
            done
            for f in "$SDK"/platforms/android-*/android.jar; do
              if [ -f "$f" ]; then echo "$f"; return 0; fi
            done
            return 1
          }

          BT="$(pick_bt || true)"
          JAR="$(pick_jar || true)"

          if [ -z "$BT" ] || [ -z "$JAR" ]; then
            echo "预装 SDK 缺少 build-tools / platform，使用 sdkmanager 安装…"
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-34" "build-tools;34.0.0"
            BT="$(pick_bt || true)"
            JAR="$(pick_jar || true)"
          fi

          if [ -z "$BT" ] || [ -z "$JAR" ]; then
            echo "::error::Android SDK 准备失败：找不到 build-tools 或 android.jar"
            exit 1
          fi
          echo "build-tools = $BT"
          echo "android.jar  = $JAR"
          echo "BT=$BT"   >> "$GITHUB_ENV"
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      # 版本号统一在这里算一次，编译和发布共用同一个值，
      # 这样「App 里显示的版本号」与「下载的 APK 文件名」永远一致。
      - name: 计算版本号 (1.x)
        run: |
          # 主版本号 MAJOR：升到 2 时由人工把下面 MAJOR 改为 2，
          # 并同步把 MINOR_BASE 设为当时构建号，使次版本从 1 重新开始（如 2.1）。
          MAJOR=1
          MINOR_BASE=8
          RUN="${{ github.run_number }}"
          VER="${MAJOR}.$(( RUN - MINOR_BASE ))"
          echo "VERSION_NAME=${VER}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${RUN}" >> "$GITHUB_ENV"
          echo "本次版本号：${VER}（构建 #${RUN}）"

      - name: 编译并签名 APK
        run: bash tools/build_apk.sh

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: family-call-helper-apk
          path: dist/*.apk
          if-no-files-found: error

      # 发布到固定的 latest Release：直接挂 .apk（非 ZIP），永久可下载。
      # 该步骤在 GitHub 自己的 runner 上运行，能正常访问 releases 上传端点，
      # 不受本机/沙箱网络 DNS 限制影响。
      - name: 发布到 Release (latest, 版本号 1.x)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 版本号已在上一步算好（VERSION_NAME），与 App 内部 versionName 一致
          VER="${VERSION_NAME}"
          RUN="${{ github.run_number }}"
          # 严格按文件名取本次产物，不再用「dist 里第一个 apk」——
          # 那样一旦 dist 里有历史残留，就会把旧包当新包发出去。
          SRC="dist/亲情接听助手-v${VER}.apk"
          if [ ! -f "$SRC" ]; then
            echo "::warning::未找到 $SRC，回退为 dist 下唯一的 apk"
            SRC="$(ls dist/*.apk | head -n1)"
          fi
          echo "本次构建产物：$SRC"
          # 复制为带版本号的 ASCII 文件名，避免中文名被截断
          APK="dist/family-call-helper-v${VER}.apk"
          cp "$SRC" "$APK"
          echo "准备发布 APK: $APK (版本 v${VER})，App 内版本号同为 v${VER}"
          # 防呆：确认包内版本号与文件名一致，不一致直接失败，避免又发出旧包
          AAPT2="${BT:+$BT/aapt2}"; AAPT2="${AAPT2:-aapt2}"
          BADGE="$("$AAPT2" dump badging "$APK" 2>/dev/null | head -1 || true)"
          echo "包内信息：$BADGE"
          case "$BADGE" in
            *"versionName='${VER}'"*) echo "✅ 版本号校验通过" ;;
            *) echo "::error::包内版本号与预期 v${VER} 不一致，疑似发错包：$BADGE"; exit 1 ;;
          esac
          # 删除旧的 latest 发布与标签，重建为滚动最新版（固定链接下载）
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
          gh release create latest "$APK" \
            --title "最新构建 v${VER}" \
            --notes "版本 v${VER}（构建 #${RUN}），基于提交 ${{ github.sha }} 自动构建。" \
            --prerelease
